<!DOCTYPE html>
<html lang="{{ lang_code }}" dir="{{ text_direction }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ app_name }} - Admin</title>
    
    <!-- Shared CSS -->
    <link rel="stylesheet" href="/static/shared/css/admin.css">
    <!-- Language-specific admin CSS (optional) -->
    {% block head_extra %}{% endblock %}
</head>
<body>
    <header class="admin-header">
        <div class="admin-header-content">
            <h1>{{ app_name }} Admin</h1>
            <div class="admin-user">
                {% if user_email %}
                <span>{{ user_email }}</span>
                <form action="/admin/logout" method="post" style="display: inline;">
                    <button type="submit" class="btn btn-small btn-outline">Logout</button>
                </form>
                {% endif %}
            </div>
        </div>
    </header>

    <div class="admin-container">
        {% block content %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
